l_english:
 agp_native_father_test.0001.t:0 "Native Father Test: set_father"
 agp_native_father_test.0001.desc:0 "[test_father.GetFullNameNoTooltip] was assigned as the female father of [test_child.GetFullNameNoTooltip].\n\nLeft portrait: female father\nRight portrait: child\n\nClick either portrait to open the character window."
 agp_native_father_test.0002.t:0 "Native Father Test: set_real_father"
 agp_native_father_test.0002.desc:0 "[test_father.GetFullNameNoTooltip] was assigned as the female real father of [test_child.GetFullNameNoTooltip].\n\nLeft portrait: female father\nRight portrait: child\n\nClick either portrait to open the character window."
 agp_native_father_test.0003.t:0 "Native Father Test: create_character"
 agp_native_father_test.0003.desc:0 "[test_child.GetFullNameNoTooltip] was created with two female parents.\n\nLeft portrait: female father, [test_father.GetFullNameNoTooltip]\nCenter portrait: child, [test_child.GetFullNameNoTooltip]\nRight portrait: mother, [test_mother.GetFullNameNoTooltip]\n\nClick a portrait to open the character window."
 agp_native_father_test.0004.t:0 "Native Father Test: make_pregnant"
 agp_native_father_test.0004.desc:0 "[test_mother.GetFullNameNoTooltip] was made pregnant with [test_father.GetFullNameNoTooltip] as the female father.\n\nLeft portrait: female father\nRight portrait: pregnant mother\n\nClick either portrait to open the character window."
 agp_native_father_test.0005.t:0 "Native Father Test: Father Scopes"
 agp_native_father_test.0005.desc.success:0 "PASS: both native father scopes resolved to the female father.\n\nSave, reload, and fire this test again to confirm persistence."
 agp_native_father_test.0005.desc.partial:0 "PARTIAL: the family father scope resolved, but the real-father scope did not."
 agp_native_father_test.0005.desc.failure:0 "FAIL: the female father did not resolve through the expected native scopes."
 agp_native_father_test.0006.t:0 "Native Father Test: Grandparents"
 agp_native_father_test.0006.desc.success:0 "PASS: paternal and maternal female grandfather scopes resolved.\n\nInspect the child's Grandparents tab before and after save/reload; all four grandparents are female."
 agp_native_father_test.0006.desc.failure:0 "FAIL: at least one female grandfather scope did not resolve."
 agp_native_father_test.0007.t:0 "Native Father Test: Dynasty Inheritance"
 agp_native_father_test.0007.desc.success:0 "PASS: the child inherited the female father's dynasty through create_character."
 agp_native_father_test.0007.desc.failure:0 "FAIL: the child did not inherit the female father's dynasty. Run this while playing a dynastic ruler."
 agp_native_father_test.0008.t:0 "Native Father Test: Distinct Parent Scopes"
 agp_native_father_test.0008.desc.success:0 "PASS: the child has distinct female mother, father, and real-father scopes. The real father is the father's mother.\n\nPlay as the center portrait (the child). The three debug interactions should appear only on their matching parent character."
 agp_native_father_test.0008.desc.failure:0 "FAIL: at least one distinct native parent scope did not resolve."
 agp_native_father_test_make_pregnant_interaction:0 "Make Pregnant (Native Female Father Test)"
 agp_native_father_test_make_pregnant_interaction_desc:0 "Use native make_pregnant with [recipient.GetShortUIName] as carrier and [actor.GetShortUIName] as the female father."
 agp_native_father_test_become_pregnant_interaction:0 "Become Pregnant (Native Female Father Test)"
 agp_native_father_test_become_pregnant_interaction_desc:0 "Use native make_pregnant with [actor.GetShortUIName] as carrier and [recipient.GetShortUIName] as the female father."
 agp_native_father_test_mother_scope_interaction:0 "Mother Scope Test"
 agp_native_father_test_mother_scope_interaction_desc:0 "Visible only when the selected character is the actor's native mother."
 agp_native_father_test_father_scope_interaction:0 "Father Scope Test"
 agp_native_father_test_father_scope_interaction_desc:0 "Visible only when the selected character is the actor's native father."
 agp_native_father_test_real_father_scope_interaction:0 "Real Father Scope Test"
 agp_native_father_test_real_father_scope_interaction_desc:0 "Visible only when the selected character is the actor's native real father."
 agp_native_father_test.close:0 "Close"
