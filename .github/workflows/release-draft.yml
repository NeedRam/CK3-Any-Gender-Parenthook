name: Build draft AGP release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from Installer/release-manifest.json
        required: true
        default: 1.0.0
  push:
    tags:
      - v*.*.*

permissions:
  contents: write
  checks: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select release version
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'Installer/python/requirements-build.txt') {
            python -m pip install --disable-pip-version-check -r Installer/python/requirements-build.txt
          } elseif (Test-Path -LiteralPath 'Installer/python/requirements.txt') {
            python -m pip install --disable-pip-version-check -r Installer/python/requirements.txt
          } else {
            python -m pip install --disable-pip-version-check pyinstaller
          }

      - name: Build native x64 payload
        shell: powershell
        run: "& '.\\Native Hook\\build.ps1' -Clean"

      - name: Run installer contract and transition tests
        id: installer_tests
        shell: powershell
        run: |
          $testOutput = (& python -m unittest discover -s Installer/python/tests -q 2>&1 | Out-String)
          $testExit = $LASTEXITCODE
          Write-Host $testOutput
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'agp-installer-tests.txt'), $testOutput)
          "exit_code=$testExit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Publish installer test diagnostics
        if: steps.installer_tests.outputs.exit_code != '0'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $testOutput = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'agp-installer-tests.txt') -Raw
          if ($testOutput.Length -gt 60000) {
            $testOutput = $testOutput.Substring($testOutput.Length - 60000)
          }
          $body = @{
            name = 'installer-test-diagnostics'
            head_sha = $env:GITHUB_SHA
            status = 'completed'
            conclusion = 'failure'
            output = @{
              title = 'Installer test failure'
              summary = 'The release workflow installer suite failed on the Windows runner.'
              text = $testOutput
            }
          } | ConvertTo-Json -Depth 5
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/check-runs" | Out-Null
          exit 1

      - name: Build Python GUI front end
        shell: pwsh
        run: |
          $buildScript = 'Installer/python/build.ps1'
          $buildModule = 'Installer/python/build.py'
          $spec = Get-ChildItem -LiteralPath 'Installer/python' -Filter '*.spec' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (Test-Path -LiteralPath $buildScript -PathType Leaf) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript
          } elseif (Test-Path -LiteralPath $buildModule -PathType Leaf) {
            python $buildModule
          } elseif ($spec) {
            python -m PyInstaller --noconfirm --clean $spec.FullName
          } else {
            Write-Host 'No dedicated Python build driver found; release assembly will require Installer/AGPInstaller.exe.'
          }
          foreach ($exe in @('Installer/AGPInstaller.exe', 'Installer/AGPUninstaller.exe')) {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Python build did not produce the required phase-2 entrypoint $exe."
            }
          }

      - name: Assemble unsigned package
        shell: pwsh
        run: .\release\build-release.ps1 -Version '${{ steps.release.outputs.version }}' -SkipNativeBuild

      - name: Attest ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: release/out/Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-win64.zip

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Any-Gender Parenthook v${{ steps.release.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/out/Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-win64.zip
            release/out/Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-win64.zip.sha256
            release/out/Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-provenance.json
