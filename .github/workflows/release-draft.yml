name: Build AGP release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from Installer/release-manifest.json
        required: true
        default: 1.1.1
  push:
    tags:
      - v*.*.*

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    # Native releases are pinned to Visual Studio 2022. Native Hook/toolchain.json
    # selects and verifies the exact MSVC and Windows SDK versions.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a main-line release commit
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release builds must use a commit reachable from main.'
          }

      - name: Select release version
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'Installer/python/requirements-build.txt') {
            python -m pip install --disable-pip-version-check -r Installer/python/requirements-build.txt
          } elseif (Test-Path -LiteralPath 'Installer/python/requirements.txt') {
            python -m pip install --disable-pip-version-check -r Installer/python/requirements.txt
          } else {
            python -m pip install --disable-pip-version-check pyinstaller
          }

      - name: Run installer contract and transition tests
        shell: cmd
        run: python -m unittest discover -s Installer/python/tests -v

      - name: Build Python GUI front end
        shell: pwsh
        run: |
          $buildScript = 'Installer/python/build.ps1'
          $buildModule = 'Installer/python/build.py'
          $spec = Get-ChildItem -LiteralPath 'Installer/python' -Filter '*.spec' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (Test-Path -LiteralPath $buildScript -PathType Leaf) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript
          } elseif (Test-Path -LiteralPath $buildModule -PathType Leaf) {
            python $buildModule
          } elseif ($spec) {
            python -m PyInstaller --noconfirm --clean $spec.FullName
          } else {
            Write-Host 'No dedicated Python build driver found; release assembly will require Installer/AGPInstaller.exe.'
          }
          foreach ($exe in @('Installer/AGPInstaller.exe', 'Installer/AGPUninstaller.exe')) {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Python build did not produce the required phase-2 entrypoint $exe."
            }
          }

      - name: Assemble unsigned package from pinned native release
        shell: pwsh
        run: .\release\build-release.ps1 -Version '${{ steps.release.outputs.version }}' -SkipNativeBuild -RequireCanonicalCi

      - name: Attest ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: release/out/*.zip

      - name: Publish draft GitHub release
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Any-Gender Parenthook v${{ steps.release.outputs.version }}
          draft: true
          generate_release_notes: false
          body_path: release/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/out/AGP v${{ steps.release.outputs.version }} Base Files (Manual Install).zip
            release/out/AGP v${{ steps.release.outputs.version }} Base Files (Manual Install).zip.sha256
            release/out/AGP v${{ steps.release.outputs.version }} Base Files (Manual Install)-provenance.json
            release/out/AGP v${{ steps.release.outputs.version }} Batch File Installer.zip
            release/out/AGP v${{ steps.release.outputs.version }} Batch File Installer.zip.sha256
            release/out/AGP v${{ steps.release.outputs.version }} Batch File Installer-provenance.json
            release/out/AGP v${{ steps.release.outputs.version }} EXE Installer.zip
            release/out/AGP v${{ steps.release.outputs.version }} EXE Installer.zip.sha256
            release/out/AGP v${{ steps.release.outputs.version }} EXE Installer-provenance.json

      - name: Remove obsolete combined-package assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect draft release assets.' }
          $obsolete = @(
            "Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-win64.zip",
            "Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-win64.zip.sha256",
            "Any-Gender-Parenthook-v${{ steps.release.outputs.version }}-provenance.json"
          )
          foreach ($asset in @($release.assets | Where-Object { $_.name -in $obsolete })) {
            gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$($asset.id)"
          }
